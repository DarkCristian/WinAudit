name: Validate WinAudit
on:
  push:
    paths:
      - '**.ps1'
      - '**.psm1'
      - '.github/workflows/validate-standalone.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Features.Tests.ps1
      - name: PowerShell 7
        shell: pwsh
        run: .\tests\Features.Tests.ps1
