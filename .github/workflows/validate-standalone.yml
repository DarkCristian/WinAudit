name: Validate WinAudit
on:
  push:
    paths:
      - '**.ps1'
      - '**.psm1'
      - '.github/workflows/validate-standalone.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, commit verificado
        with:
          persist-credentials: false
      - name: Canonical distribution bytes
        shell: pwsh
        run: |
          $file = Join-Path $PWD 'dist/WinAudit-Standalone.ps1'
          $text = [IO.File]::ReadAllText($file).Replace("`r`n","`n")
          [IO.File]::WriteAllText($file, $text, (New-Object Text.UTF8Encoding($false)))
          $expected = git rev-parse 'HEAD:dist/WinAudit-Standalone.ps1'
          $actual = git hash-object --no-filters -- $file
          if ($actual -ne $expected) { throw 'Distribution bytes differ from the repository blob.' }
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host $PSVersionTable.PSVersion
          .\tests\Security.Tests.ps1
          .\tests\Features.Tests.ps1
          .\tests\Reputation.Tests.ps1
          .\tests\Directory.Tests.ps1
      - name: PowerShell 7
        shell: pwsh
        run: |
          Write-Host $PSVersionTable.PSVersion
          .\tests\Security.Tests.ps1
          .\tests\Features.Tests.ps1
          .\tests\Reputation.Tests.ps1
          .\tests\Directory.Tests.ps1
      - name: Package standalone and checksums
        shell: pwsh
        run: |
          $file = 'dist/WinAudit-Standalone.ps1'
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS.txt'), "$hash  WinAudit-Standalone.ps1`n", (New-Object Text.UTF8Encoding($false)))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, commit verificado
        with:
          name: WinAudit-standalone-tested
          path: |
            dist/WinAudit-Standalone.ps1
            dist/SHA256SUMS.txt
          if-no-files-found: error
